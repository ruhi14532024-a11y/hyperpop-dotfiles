image {
    monitor =
    path = /home/suleyman/Image/Fondo/23970564.png
    border_size = 2
    border_color = $lk_line
    size = 100
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 25, 170
    halign = center
    valign = center
}
# NAME
label {
    monitor =
    text = $USER
    color = $lk_text
    font_size = 20
    font_family = Monocraft, FantasqueSansM Nerd Font
    position = 25, 80
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color = $lk_time
    font_size = 64
    font_family = Monocraft, FantasqueSansM Nerd Font
    position = 30, -20
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = $lk_date
    font_size = 19
    font_family = Monocraft, FantasqueSansM Nerd Font
    position = 35, -90
    halign = center
    valign = center
}

# USER-BOX grande
shape {
    monitor =
    size = 500, 500
    color = $lk_card
    rounding = 16
    border_size = 1
    border_color = $lk_frame
    position = 34, -70
    halign = center
    valign = center
}

# USER-BOX pequeño
shape {
    monitor =
    size = 320, 55
    color = $lk_soft
    rounding = 14
    border_size = 1
    border_color = $lk_frame
    position = 34, -190
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text =     $USER
    color = $lk_text
    font_size = 16
    font_family = Monocraft, FantasqueSansM Nerd Font
    position = 38, -190
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 320, 55
    outer_color = $lk_line
    inner_color = $lk_inner
    font_color = $lk_text
    placeholder_text = <i><span foreground="##aaaaaa99">   Enter Pass</span></i>
    font_family = Monocraft, FantasqueSansM Nerd Font
    position = 34, -268
    halign = center
    valign = center
}
